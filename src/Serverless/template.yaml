            Role: arn:aws:iam::549273701895:role/PracticePackLambdaExecutionRole
            Events:
                GetAddresses:
                    Type: HttpApi
                    Properties:
                        Path: /addresses
                        Method: GET
                GetAddress:
                    Type: HttpApi
                    Properties:
                        Path: /addresses/{id}
